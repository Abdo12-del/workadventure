<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NG Academy — Gino the owl">
  <!-- NG Academy app mark: Gino, the little blue owl with a graduation cap -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="#38b6ff"/>
  <!-- wings -->
  <ellipse cx="98" cy="300" rx="52" ry="86" fill="#1e9be6" transform="rotate(18 98 300)"/>
  <ellipse cx="414" cy="300" rx="52" ry="86" fill="#1e9be6" transform="rotate(-18 414 300)"/>
  <!-- body -->
  <ellipse cx="256" cy="286" rx="168" ry="176" fill="#54c3ff"/>
  <!-- belly -->
  <ellipse cx="256" cy="330" rx="104" ry="112" fill="#ffffff"/>
  <!-- eyes -->
  <circle cx="192" cy="228" r="66" fill="#ffffff"/>
  <circle cx="320" cy="228" r="66" fill="#ffffff"/>
  <circle cx="200" cy="236" r="30" fill="#12263a"/>
  <circle cx="312" cy="236" r="30" fill="#12263a"/>
  <circle cx="210" cy="226" r="10" fill="#ffffff"/>
  <circle cx="322" cy="226" r="10" fill="#ffffff"/>
  <!-- brows -->
  <path d="M150 168 q42 -26 84 -6" stroke="#12263a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M278 162 q42 -20 84 6" stroke="#12263a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- beak -->
  <path d="M256 268 l34 30 -34 34 -34 -34 z" fill="#ffa62b"/>
  <!-- graduation cap -->
  <path d="M256 62 L418 128 256 194 94 128 Z" fill="#1d2430"/>
  <path d="M186 158 v44 q70 34 140 0 v-44 l-70 28 z" fill="#2a3242"/>
  <circle cx="418" cy="128" r="12" fill="#ffc14d"/>
  <path d="M418 132 q14 44 4 74" stroke="#ffc14d" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="422" cy="214" r="14" fill="#ffc14d"/>
  <!-- feet -->
  <ellipse cx="204" cy="458" rx="34" ry="18" fill="#ffa62b"/>
  <ellipse cx="308" cy="458" rx="34" ry="18" fill="#ffa62b"/>
</svg>
